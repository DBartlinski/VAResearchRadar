# Publications dated before this are ignored.
start_date: 2026-10-01

# PubMed/OpenAlex are re-queried this many days back each run (never earlier than start_date).
lookback_days: 45

# NCBI and OpenAlex ask for a contact email on API requests.
contact_email: ""

paths:
  database: data/vadaily.db
  site: site

pubmed:
  enabled: true
  # Optional NCBI_API_KEY environment variable raises the rate limit.
  query: >-
    ("Veterans Affairs"[ad] OR "Veterans Health Administration"[ad] OR "Veterans Administration"[ad]
    OR "VA Medical Center"[ad] OR "VA Healthcare"[ad] OR "VA Health Care"[ad] OR "VAMC"[ad]
    OR "VAHCS"[ad] OR "Department of Veterans"[ad]
    OR "BLRD VA"[gr] OR "CSRD VA"[gr] OR "HSRD VA"[gr] OR "RRD VA"[gr] OR "CSP VA"[gr])

openalex:
  enabled: true
  # Leave empty to auto-resolve "Department of Veterans Affairs".
  institution_ids: [I1322918889]  # United States Department of Veterans Affairs (includes child institutions)
  funder_ids: [F4320306127]       # U.S. Department of Veterans Affairs

scoring:
  tiers:
    high: 45
    medium: 25

  veteran_in_title:
    weight: 10
    keywords: ["veteran*", "military", "service member*", "servicemember*"]

  topics:
    - name: Suicide prevention
      weight: 30
      keywords: ["suicid*", "lethal means", "firearm*"]
    - name: Toxic and military exposures / PACT Act
      weight: 30
      keywords: ["burn pit*", "airborne hazard*", "Agent Orange", "PACT Act", "Gulf War", "Camp Lejeune", "toxic exposure*", "open burn*", "herbicide*", "military exposure*", "occupational exposure*", "environmental exposure*", "chemical exposure*", "toxicant*", "PFAS", "depleted uranium", "ionizing radiation", "radiation exposure", "asbestos", "solvent exposure*"]
    - name: Million Veteran Program
      weight: 25
      keywords: ["Million Veteran Program"]
    - name: Psychedelic therapies
      weight: 30
      keywords: ["psilocybin", "psilocin", "MDMA", "ibogaine", "LSD", "ayahuasca", "mescaline", "psychedelic*", "esketamine", "ketamine"]
    - name: LGBTQ+ health
      weight: 30
      keywords: ["LGBT*", "lesbian", "gay", "bisexual", "transgender", "nonbinary", "queer", "sexual minorit*", "gender minorit*", "sexual and gender minorit*", "gender diverse", "gender identity", "sexual orientation", "gender-affirming", "gender dysphoria"]
    - name: Precision medicine
      weight: 30
      keywords: ["precision medicine", "precision oncology", "precision health", "personalized medicine", "pharmacogenom*", "pharmacogenetic*", "genomic medicine", "polygenic*", "genome-wide", "whole genome sequencing", "whole-genome sequencing"]
    - name: PTSD and trauma
      weight: 15
      keywords: ["PTSD", "posttraumatic stress", "post-traumatic stress", "moral injury", "military sexual trauma"]
    - name: Traumatic brain injury
      weight: 30
      keywords: ["traumatic brain injur*", "TBI", "brain injur*", "head injur*", "blast exposure", "concussion*"]
    - name: Homelessness
      weight: 30
      keywords: ["homeless*", "housing instability", "housing insecurity", "unhoused", "housing first", "HUD-VASH"]
    - name: Prosthetics, amputation and spinal cord injury
      weight: 15
      keywords: ["prosthe*", "amputat*", "spinal cord injur*", "exoskeleton*"]
    - name: Opioids and substance use
      weight: 20
      keywords: ["opioid*", "buprenorphine", "naloxone", "naltrexone", "fentanyl", "overdose*", "methamphetamine", "addiction", "alcohol use disorder", "substance use disorder*", "cannabis use disorder", "stimulant use", "re:\\bSUD\\b", "re:\\bOUD\\b"]
    - name: Women veterans
      weight: 20
      keywords: ["women veteran*", "female veteran*", "servicewomen", "women service member*", "female service member*", "women in the military", "women's health"]
    - name: GLP-1, diabetes and heart failure
      weight: 20
      keywords: ["GLP-1*", "semaglutide", "tirzepatide", "liraglutide", "dulaglutide", "exenatide", "heart failure"]
    - name: AI and digital health
      weight: 20
      keywords: ["AI", "synthetic intelligence", "artificial intelligence", "machine learning", "deep learning", "large language model*", "ChatGPT", "telehealth", "telemedicine", "telemental health"]
    - name: Cancer
      weight: 20
      keywords: ["cancer*", "oncolog*", "carcinoma*", "lymphoma", "leukemia", "melanoma", "sarcoma", "myeloma", "tumor*", "neoplasm*", "chemotherapy", "immunotherapy", "radiotherapy"]
    - name: Dementia and brain health
      weight: 10
      keywords: ["dementia", "Alzheimer*", "Parkinson*", "cognitive decline"]
    - name: COVID and infectious disease
      weight: 10
      keywords: ["long COVID", "COVID-19", "SARS-CoV-2", "antimicrobial resistance"]
    - name: Caregivers and families
      weight: 8
      keywords: ["caregiver*"]
    - name: Rural health
      weight: 20
      keywords: ["rural", "rurality", "urban-rural", "Appalachia", "drive time", "travel distance", "distance to care"]
    - name: Community care and access
      weight: 20
      keywords: ["community care", "Community Care Network", "MISSION Act", "Choice Act", "non-VA care", "purchased care", "wait time*"]

  # Prefix a keyword with "re:" to use a raw regular expression.
  study_designs:
    - name: Randomized trial
      weight: 15
      keywords: ["re:\\brandomi[sz]ed (?:controlled |clinical )?trial", "re:\\bcluster[- ]randomi[sz]ed", "RCT"]
    - name: Meta-analysis / systematic review
      weight: 8
      keywords: ["meta-analys*", "systematic review"]
    - name: Cooperative Studies Program
      weight: 10
      keywords: ["Cooperative Studies Program", "re:\\bCSP\\s*#?\\d{2,4}\\b"]
    - name: Large national study
      weight: 8
      keywords: ["nationwide", "national cohort", "national sample", "re:\\b\\d{1,3}(?:,\\d{3})+\\s+(?:veterans|patients|participants|individuals|adults)\\b"]
    - name: Target trial emulation
      weight: 6
      keywords: ["target trial emulation"]
    - name: Registered clinical trial
      weight: 5
      keywords: ["re:\\bNCT\\d{8}\\b"]

  # Journal tier uses OpenAlex "2-year mean citedness" (an impact-factor-like metric), with name overrides.
  journal_tiers:
    top_min_citedness: 10
    mid_min_citedness: 4
    top_weight: 25
    mid_weight: 10
    always_top: ["New England Journal of Medicine", "The New England Journal of Medicine", "JAMA", "The Lancet",
                 "BMJ", "The BMJ", "Nature", "Science", "Cell", "Nature Medicine", "Annals of Internal Medicine",
                 "JAMA Psychiatry", "JAMA Internal Medicine", "JAMA Network Open", "American Journal of Psychiatry"]
    always_mid: ["Psychiatric Services", "Military Medicine", "Journal of General Internal Medicine",
                 "Health Services Research", "Medical Care"]

  funding:
    ord_funded: 15
    va_funded_only: 5

  other:
    open_access: 3
    cited_5_plus: 5

  penalties:
    preprint: -5
    conference_abstract: -15
    editorial_or_letter: -10
    erratum: -40
    retracted: -100
    non_health: -15
