name: Refresh data and deploy site

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "vadaily/**", "config/**", ".github/workflows/pages.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m vadaily.pipeline
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data/vadaily.db
          git diff --cached --quiet || (git commit -m "Refresh data" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
